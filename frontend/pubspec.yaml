name: nas_reader
description: "A lightweight NAS e-book reader with multi-device sync."
publish_to: 'none'
version: 0.8.1-tailnet+80

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 网络与存储
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.3.3+1
  connectivity_plus: ^6.0.3
  open_file: ^3.3.2
  shared_preferences: ^2.2.2

  # EPUB 渲染与解包
  webview_flutter: ^4.7.0
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  archive: ^3.6.1
  xml: ^6.5.0

  # PDF 渲染（Android PdfRenderer / iOS PDFKit 原生视图）
  flutter_pdfview: 1.4.5

  # 字体导入与文件选择
  file_picker: ^10.0.0+1

  # 跳转系统浏览器打开 GitHub Release 下载页
  url_launcher: ^6.3.0

  # 读取构建时注入的 versionName/versionCode
  package_info_plus: ^8.0.0
  charset: ^2.0.1
  enough_convert: 1.6.0
  cp949_codec: 1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # EPUB 渲染依赖的 JS 库本地化，避免运行时从 CDN 加载（离线可用 + 防供应链篡改）
    - assets/js/jszip.min.js
    - assets/js/epub.min.js
    # 阅读主题背景图
    - assets/readbg_1.png
    - assets/readbg_2.jpg
    - assets/readbg_3.jpg
    - assets/readbg_4.jpg