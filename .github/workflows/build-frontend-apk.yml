name: Build Android APK

on:
  push:
    # branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Tailnet Android library
        working-directory: ./third_party/tailnet_android
        env:
          GOTOOLCHAIN: go1.26.0+auto
        run: |
          yes | sdkmanager "ndk;28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
          gomobile init
          gomobile bind -target=android/arm64 -androidapi=24 -o tailnetandroid.aar .

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: flutter pub get

      # 关键步骤：从 GitHub Secrets 还原固定的 release.jks 密钥到 frontend/android/app/
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/release.jks

      # 编译 Release APK 并注入签名环境变量
      - name: Build Release APK
        working-directory: ./frontend
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      # 动态计算版本名并重命名各 ABI 的 APK 为 NasReader-<Tag号>-<ABI>.apk
      - name: Rename APKs with Tag
        id: prepare_apk
        run: |
          # 提取 Tag 名（例如 v1.0.0），若无 Tag 则使用 Short SHA
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${GITHUB_SHA::7}"
          fi
          
          APK_DIR="frontend/build/app/outputs/flutter-apk"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC_PATH="${APK_DIR}/app-${ABI}-release.apk"
            if [[ -f "$SRC_PATH" ]]; then
              TARGET_PATH="${APK_DIR}/NasReader-${TAG_NAME}-${ABI}.apk"
              echo "Renaming $SRC_PATH to $TARGET_PATH"
              cp "$SRC_PATH" "$TARGET_PATH"
            fi
          done
          
          # 输出变量给后续步骤使用
          echo "apk_name=NasReader-${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "apk_glob=${APK_DIR}/NasReader-${TAG_NAME}-*.apk" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_glob }}
          retention-days: 14

      - name: Publish Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_apk.outputs.apk_glob }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}